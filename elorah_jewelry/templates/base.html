<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include "partials/_seo_meta.html" %}
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body class="bg-ivory-50 text-charcoal-900 font-sans">
    <nav class="p-4 bg-white shadow flex justify-between">
        <a href="/" class="text-xl font-serif text-gold-600">{{ site_config.store_name }}</a>
        <div>
            <!-- Cart count partial logic here -->
            Cart ({{ cart_item_count|default:0 }})
        </div>
    </nav>
    <main class="min-h-screen">
        {% block content %}{% endblock %}
    </main>
    <footer class="p-4 bg-charcoal-900 text-ivory-50 text-center">
        <p>&copy; {{ current_year }} {{ site_config.store_name }}. All rights reserved.</p>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
