{% extends "base.html" %}
{% block title %}{% if object %}Edit{% else %}Add{% endif %} Address{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-10">
    <h2 class="text-3xl font-serif mb-6">{% if object %}Edit{% else %}Add{% endif %} Address</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-gold-600 text-white p-3 mt-4 w-full">Save Address</button>
    </form>
</div>
{% endblock %}
