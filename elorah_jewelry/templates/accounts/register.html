{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 border border-gray-200">
    <h2 class="text-3xl font-serif text-charcoal-900 mb-6 text-center">Create Account</h2>
    <form method="post" action="{% url 'accounts:register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-gold-600 text-white p-3 mt-4">Register</button>
    </form>
</div>
{% endblock %}
