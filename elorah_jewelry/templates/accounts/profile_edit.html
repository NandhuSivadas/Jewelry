{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto py-10 px-4">
    <h2 class="text-3xl font-serif mb-6">Edit Profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="bg-gold-600 text-white p-3 mt-4">Save Changes</button>
    </form>
</div>
{% endblock %}
