{% extends "base.html" %}
{% block title %}Log In{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 border border-gray-200">
    <h2 class="text-3xl font-serif text-charcoal-900 mb-6 text-center">Sign In</h2>
    <form method="post" action="{% url 'accounts:login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        {{ form.as_p }}
        <button type="submit" class="w-full bg-gold-600 text-white p-3 mt-4">Log In</button>
    </form>
    <p class="mt-4 text-center">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-gold-600 underline">Register</a></p>
    <p class="mt-2 text-center"><a href="{% url 'accounts:password-reset' %}" class="text-sm text-gray-500">Forgot Password?</a></p>
</div>
{% endblock %}
