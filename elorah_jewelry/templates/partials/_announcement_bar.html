<div x-data="{ currentMsg: 0, msgs: ['⚠️ Delivery Delay: Orders may take 5-7 days to dispatch.', 'International Orders: WhatsApp +91 90000 00000'] }" 
     x-init="setInterval(() => { currentMsg = currentMsg === 0 ? 1 : 0 }, 4000)"
     class="bg-brand-header text-brand-dark text-xs py-2 px-4 flex justify-between items-center w-full z-50 relative h-[40px] uppercase tracking-[0.1em] font-medium border-b border-brand-panel">
    <button @click="currentMsg = currentMsg === 0 ? 1 : 0" class="text-brand-muted hover:text-brand-gold px-2">‹</button>
    <div class="flex-1 text-center truncate transition-opacity duration-500">
        <span x-text="msgs[currentMsg]"></span>
    </div>
    <button @click="currentMsg = currentMsg === 0 ? 1 : 0" class="text-brand-muted hover:text-brand-gold px-2">›</button>
</div>
