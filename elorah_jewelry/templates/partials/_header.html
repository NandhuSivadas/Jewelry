<!-- Sticky Header with Blur -->
<header id="site-header" x-data="{ mobileMenuOpen: false, searchOpen: false, cartOpen: false }" 
        class="bg-brand-header sticky top-0 z-40 w-full h-[var(--header-height)] border-b border-brand-panel">
    
    <!-- Main Header Row -->
    <div class="container mx-auto px-4 h-full flex justify-between items-center relative" x-show="!searchOpen">
        
        <!-- Left: Hamburger (Desktop & Mobile) -->
        <button @click="mobileMenuOpen = true" class="text-brand-dark focus:outline-none flex-shrink-0" aria-label="Open Menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>

        <!-- Center: Wordmark -->
        <a href="/" class="text-3xl font-serif tracking-[0.2em] text-brand-dark absolute left-1/2 transform -translate-x-1/2">
            ELORAH
        </a>

        <!-- Right: Actions -->
        <div class="flex items-center space-x-5 flex-shrink-0">
            <div class="hidden md:flex items-center text-xs tracking-wider text-brand-dark font-medium border-r border-gray-300 pr-5 cursor-pointer hover:text-brand-gold transition">
                India | INR ₹ <span class="ml-1 text-[10px]">⌄</span>
            </div>
            
            <button @click="searchOpen = true" class="hover:text-brand-gold transition" aria-label="Search">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>
            <a href="{% url 'accounts:dashboard' %}" class="hover:text-brand-gold transition" aria-label="Account">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </a>
            <button @click="cartOpen = true" class="relative hover:text-brand-gold transition" aria-label="Cart">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                {% if cart_item_count %}
                <span class="absolute -top-2 -right-2 bg-brand-gold text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">{{ cart_item_count }}</span>
                {% endif %}
            </button>
        </div>
    </div>

    <!-- Search Overlay Row (Replaces header row) -->
    <div class="container mx-auto px-4 h-full flex justify-between items-center" x-show="searchOpen" style="display: none;">
        <form action="{% url 'catalog:product-search' %}" method="get" class="w-full flex items-center border-b border-brand-dark pb-2">
            <span class="text-brand-muted uppercase tracking-widest text-xs mr-4">Search</span>
            <input type="text" name="q" placeholder="What are you looking for?" class="w-full text-xl font-serif focus:outline-none bg-transparent placeholder-gray-400">
            <button type="submit" class="text-brand-dark mr-4 hover:text-brand-gold"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
            <button type="button" @click="searchOpen = false" class="text-brand-dark hover:text-brand-gold"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </form>
    </div>
    <!-- Search backdrop -->
    <div x-show="searchOpen" class="fixed inset-0 top-[var(--header-height)] bg-brand-page/80 backdrop-blur-sm z-30" style="display: none;"></div>

    <!-- Mobile/Desktop Nav Drawer -->
    <div x-show="mobileMenuOpen" class="fixed inset-0 z-50 flex" style="display: none;">
        <div @click="mobileMenuOpen = false" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div class="relative w-4/5 max-w-sm bg-brand-page h-full shadow-xl flex flex-col overflow-y-auto transform transition-transform"
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full">
            <div class="p-6 border-b border-brand-panel flex justify-between items-center">
                <span class="font-serif text-xl tracking-widest text-brand-dark">ELORAH</span>
                <button @click="mobileMenuOpen = false" class="hover:text-brand-gold"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <nav class="flex flex-col p-6 space-y-6 font-sans text-sm uppercase tracking-widest font-medium">
                <!-- Simple flat links for now. Real accordion logic takes much more boilerplate -->
                <a href="{% url 'catalog:product-list' %}?category=necklaces" class="hover:text-brand-gold">Necklaces</a>
                <a href="{% url 'catalog:product-list' %}?category=ad-stone" class="hover:text-brand-gold">AD Stone Jewellery</a>
                <a href="{% url 'catalog:product-list' %}?category=earrings" class="hover:text-brand-gold">Earrings</a>
                <a href="{% url 'catalog:product-list' %}?category=bangles" class="hover:text-brand-gold">Bangles & Bracelets</a>
                <a href="{% url 'catalog:product-list' %}?category=rings" class="hover:text-brand-gold">Finger Rings</a>
                <a href="{% url 'catalog:product-list' %}?category=bridal" class="text-brand-gold">Bridal Combos</a>
                <a href="{% url 'catalog:product-list' %}" class="mt-8 pt-4 border-t border-brand-panel hover:text-brand-gold">Shop All</a>
            </nav>
        </div>
    </div>

    <!-- Cart Drawer -->
    <div x-show="cartOpen" class="fixed inset-0 z-50 flex justify-end" style="display: none;">
        <div @click="cartOpen = false" class="fixed inset-0 bg-black/40 backdrop-blur-sm transition-opacity"></div>
        <div class="relative w-full md:w-[415px] bg-brand-header h-full shadow-2xl flex flex-col transform transition-transform"
             x-transition:enter="transition ease-out duration-300" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
             x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full">
            <div class="p-6 border-b border-brand-panel flex justify-between items-center bg-brand-page">
                <span class="font-sans uppercase tracking-widest text-sm font-bold">Your Cart</span>
                <button @click="cartOpen = false" class="hover:text-brand-gold"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex-1 p-8 overflow-y-auto flex flex-col items-center justify-center text-center bg-brand-header">
                <!-- Empty state layout matching reference -->
                <h3 class="font-serif text-2xl mb-6">Your cart is empty</h3>
                <a href="{% url 'catalog:product-list' %}" class="bg-brand-gold text-white font-sans uppercase tracking-widest text-xs font-bold py-3 px-8 hover:bg-brand-dark transition w-full mb-6">Continue Shopping</a>
                <p class="font-serif text-brand-muted italic">Have an account?</p>
                <a href="{% url 'accounts:login' %}" class="text-brand-dark font-sans uppercase tracking-widest text-xs font-bold border-b border-brand-dark mt-2 hover:text-brand-gold hover:border-brand-gold transition">Log in to check out faster</a>
            </div>
        </div>
    </div>
</header>
