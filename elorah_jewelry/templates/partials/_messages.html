{% if messages %}
<div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
    {% for message in messages %}
    <div x-data="{ show: true }" 
         x-show="show" 
         x-init="setTimeout(() => show = false, 5000)"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-x-8"
         x-transition:enter-end="opacity-100 translate-x-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-x-0"
         x-transition:leave-end="opacity-0 translate-x-8"
         class="shadow-lg min-w-[300px] border flex items-start gap-4 p-4 bg-white {% if message.tags == 'error' %}border-red-500 text-red-700{% elif message.tags == 'success' %}border-brand-gold text-brand-dark{% else %}border-gray-300 text-gray-700{% endif %}">
        
        <div class="flex-1 font-sans text-sm">
            {{ message }}
        </div>
        
        <button @click="show = false" class="text-gray-400 hover:text-gray-600 transition">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
